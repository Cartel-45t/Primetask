<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Writing Admin | PrimeTask</title><link rel="stylesheet" href="/dashboard/admin/Keith/assets/admin-navigation.css"><style>
:root{color-scheme:dark;--bg:#071426;--panel:#0d1d33;--line:#243752;--text:#eef4fb;--muted:#9aacbf;--blue:#60a5fa;--orange:#fb923c;--red:#fca5a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.main{max-width:1450px;padding:28px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}h1{margin:5px 0}.btn{border:1px solid #355171;background:#122946;color:white;padding:9px 12px;border-radius:8px;font-weight:750}.btn.primary{background:#1d4f91}.tabs{display:flex;gap:6px;overflow:auto;margin:17px 0;border-bottom:1px solid var(--line)}.tabs button{padding:10px;border:0;border-bottom:2px solid transparent;color:var(--muted);background:transparent;white-space:nowrap}.tabs .active{color:white;border-color:var(--blue)}.status{min-height:22px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:12px 0}.metric,.panel,.item{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px}.metric strong{display:block;font-size:22px}.metric span{color:var(--muted);font-size:11px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{display:grid;gap:5px;font-size:12px;color:#c7d4e5}.wide{grid-column:1/-1}input,select,textarea{width:100%;padding:9px;border:1px solid #344b67;border-radius:7px;background:#071426;color:var(--text)}textarea{min-height:80px}.list{display:grid;gap:9px}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.table{width:100%;border-collapse:collapse;min-width:750px}.table td,.table th{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}.table th{font-size:11px;color:var(--muted)}.scroll{overflow:auto}.error{color:var(--red)}@media(max-width:680px){.main{padding:18px 12px}.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="main"><header class="head"><div><div class="muted">RESTRICTED ADMIN AREA</div><h1>Academic Writing Marketplace</h1><p class="muted">Jobs, applications, bid packages and auditable credit adjustments.</p></div><button class="btn" id="refresh">Refresh</button></header><nav class="tabs" id="tabs"><button data-tab="overview" class="active">Overview</button><button data-tab="jobs">Jobs</button><button data-tab="applications">Applications</button><button data-tab="packages">Bid packages</button><button data-tab="transactions">Bid transactions</button></nav><p id="status" class="status" aria-live="polite"></p><section id="content"></section><p class="muted">No earnings are credited or withdrawals offered here: verified project-funding and service-specific payout flows have not been implemented. Freelancer commission remains $0.</p></main><script src="/assets/js/config.js"></script><script src="/dashboard/admin/Keith/assets/admin-navigation.js"></script><script>
"use strict";(()=>{const $=id=>document.getElementById(id),API=()=>String(window.PTW_API_BASE||"").replace(/\/+$/,"");let tab="overview";function say(s,error=false){$("status").textContent=s;$("status").className="status"+(error?" error":"")}function esc(s){const e=document.createElement("div");e.textContent=String(s??"");return e.innerHTML}async function api(path,opts={}){if(!API())throw Error("API configuration missing.");const r=await fetch(API()+"/admin/academic-writing"+path,{...opts,credentials:"include",headers:{Accept:"application/json",...(opts.body?{"Content-Type":"application/json"}:{}),...(opts.headers||{})}});if(r.status===401){location.replace("/auth/login");throw Error("Sign in required.")}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||"Request failed.");return d}function setTab(next){tab=next;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));render().catch(e=>say(e.message,true))}async function render(){say("Loading…");const c=$("content");if(tab==="overview"){const d=await api("/overview"),j=d.jobs||{},a=d.applications||{},b=d.bids||{};c.innerHTML=`<div class="grid">${[["Published jobs",j.published||0],["Draft jobs",j.draft||0],["Closed jobs",j.closed||0],["Total applications",Object.values(a).reduce((x,y)=>x+y,0)],["Awaiting review",a.submitted||0],["Shortlisted",a.shortlisted||0],["Awarded",a.awarded||0],["Bid credits sold",b.sold||0],["Bid credits used",b.used||0]].map(([l,v])=>`<div class="metric"><strong>${esc(v)}</strong><span>${esc(l)}</span></div>`).join("")}</div><p class="muted">${esc(d.note)}</p>`}else if(tab==="jobs"){const d=await api("/jobs");c.innerHTML=`<form id="jobForm" class="form panel"><label class="field">Title<input name="title" required maxlength="180"></label><label class="field">Service category<input name="serviceCategory" required></label><label class="field">Discipline<input name="discipline" required></label><label class="field">Subject<input name="subject" required></label><label class="field">Academic level<input name="academicLevel" required></label><label class="field">Budget minimum USD<input name="min" type="number" min="0.01" step="0.01" required></label><label class="field">Budget maximum USD<input name="max" type="number" min="0.01" step="0.01" required></label><label class="field">Required bids<input name="bids" type="number" min="1" step="1" required></label><label class="field">Application closes<input name="close" type="datetime-local" required></label><label class="field">Project deadline<input name="deadline" type="datetime-local" required></label><label class="field">Maximum successful applicants<input name="successes" type="number" value="1" min="1" required></label><label class="field">Word count<input name="words" type="number" min="1"></label><label class="field wide">Description<textarea name="description" required maxlength="12000"></textarea></label><label class="field">Scope<textarea name="scope"></textarea></label><label class="field">Instructions<textarea name="instructions"></textarea></label><label class="field">Skills (comma-separated)<input name="skills"></label><label class="field">Qualifications (comma-separated)<input name="quals"></label><label class="field">Deliverables (comma-separated)<input name="deliverables"></label><label class="field">Referencing style<input name="referencing"></label><div class="wide"><button class="btn primary">Create draft job</button></div></form><h2>Jobs</h2><div class="list">${(d.jobs||[]).map(j=>`<article class="item"><strong>${esc(j.title)}</strong> · ${esc(j.status)}<p class="muted">${esc(j.discipline)} / ${esc(j.subject)} · ${j.requiredBids} bids · $${(j.budgetMinCents/100).toFixed(2)}–$${(j.budgetMaxCents/100).toFixed(2)}</p><div class="row">${["published","paused","closed","archived"].filter(s=>s!==j.status).map(s=>`<button class="btn" data-status="${s}" data-id="${j._id}">${s}</button>`).join("")}</div></article>`).join("")||'<p class="muted">No jobs yet.</p>'}</div>`;$("jobForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),csv=k=>String(f.get(k)||"").split(",").map(x=>x.trim()).filter(Boolean);try{await api("/jobs",{method:"POST",body:JSON.stringify({title:f.get("title"),serviceCategory:f.get("serviceCategory"),discipline:f.get("discipline"),subject:f.get("subject"),academicLevel:f.get("academicLevel"),budgetMinCents:Math.round(Number(f.get("min"))*100),budgetMaxCents:Math.round(Number(f.get("max"))*100),requiredBids:Number(f.get("bids")),applicationClosesAt:new Date(f.get("close")).toISOString(),deadline:new Date(f.get("deadline")).toISOString(),successfulApplicants:Number(f.get("successes")),wordCount:f.get("words")?Number(f.get("words")):null,description:f.get("description"),scope:f.get("scope")||"",instructions:f.get("instructions")||"",skills:csv("skills"),qualifications:csv("quals"),deliverables:csv("deliverables"),referencingStyle:f.get("referencing")||""})});say("Draft created.");await render()}catch(x){say(x.message,true)}};c.querySelectorAll("[data-status]").forEach(b=>b.onclick=async()=>{try{await api(`/jobs/${b.dataset.id}/status`,{method:"PATCH",body:JSON.stringify({status:b.dataset.status})});await render()}catch(e){say(e.message,true)}})}else if(tab==="applications"){const d=await api("/applications");c.innerHTML=`<div class="list">${(d.applications||[]).map(a=>`<article class="item"><strong>${esc(a.jobId?.title)}</strong> · ${esc(a.userId?.username)} · ${esc(a.status)}<p>${esc(a.coverLetter)}</p><p class="muted">${esc(a.userId?.email)} · Proposed $${(a.proposedPriceCents/100).toFixed(2)} · ${a.bidCost} bids</p><p>${esc(a.qualifications)} · ${esc(a.experience)} · ${esc(a.skills.join(", "))}</p><div class="row">${["under_review","shortlisted","unsuccessful"].map(s=>`<button class="btn" data-app="${a._id}" data-next="${s}">${s}</button>`).join("")}<button class="btn primary" data-award="${a._id}">Award project</button></div></article>`).join("")||'<p class="muted">No applications.</p>'}</div>`;c.querySelectorAll("[data-app]").forEach(b=>b.onclick=async()=>{try{await api(`/applications/${b.dataset.app}/status`,{method:"PATCH",body:JSON.stringify({status:b.dataset.next})});await render()}catch(e){say(e.message,true)}});c.querySelectorAll("[data-award]").forEach(b=>b.onclick=async()=>{if(!confirm("Award this application? This reserves a job award slot; earnings are not credited."))return;try{await api(`/applications/${b.dataset.award}/award`,{method:"POST",body:"{}"});await render()}catch(e){say(e.message,true)}})}else if(tab==="packages"){const d=await api("/bid-packages");c.innerHTML=`<form id="pkg" class="form panel"><label class="field">Package name<input name="name" required></label><label class="field">Bid credits<input name="bids" type="number" min="1" required></label><label class="field">Price KES<input name="price" type="number" min="1" required></label><label class="field">Description<input name="description"></label><label><input name="active" type="checkbox" checked> Active</label><div><button class="btn primary">Create package</button></div></form><div class="list">${(d.packages||[]).map(p=>`<article class="item">${esc(p.name)} · ${p.bids} bids · KSh ${p.priceKes} · ${p.isActive?"active":"inactive"} <button class="btn" data-package="${p._id}" data-on="${!p.isActive}">Toggle</button></article>`).join("")}</div>`;$("pkg").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await api("/bid-packages",{method:"POST",body:JSON.stringify({name:f.get("name"),bids:Number(f.get("bids")),priceKes:Number(f.get("price")),description:f.get("description"),isActive:f.has("active")})});await render()}catch(x){say(x.message,true)}};c.querySelectorAll("[data-package]").forEach(b=>b.onclick=async()=>{try{await api(`/bid-packages/${b.dataset.package}`,{method:"PATCH",body:JSON.stringify({isActive:b.dataset.on==="true"})});await render()}catch(e){say(e.message,true)}})}else{const d=await api("/bid-transactions");c.innerHTML=`<div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Member</th><th>Type</th><th>Credits</th><th>Balance</th><th>Reference</th></tr></thead><tbody>${(d.transactions||[]).map(t=>`<tr><td>${new Date(t.createdAt).toLocaleString()}</td><td>${esc(t.userId?.username)}</td><td>${esc(t.type)}</td><td>${t.bids}</td><td>${t.previousBalance} → ${t.newBalance}</td><td>${esc(t.reference)}</td></tr>`).join("")}</tbody></table></div>`}say("")}document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$("refresh").onclick=()=>render().catch(e=>say(e.message,true));render().catch(e=>say(e.message,true))})();
</script></body></html>
